name: Olist
description: >-
  Olist is a Brazilian commerce technology company headquartered in Curitiba,
  Paraná, offering an integrated ecosystem of solutions that automate business
  management for online sellers. Its products include an ERP for inventory,
  invoicing and order automation, a multi-marketplace Integration Hub
  (Mercado Livre, TikTok Shop and others), a POS for physical stores, a digital
  account with Pix payments, shipping and fulfillment (Envios), and storefront
  creation. Olist exposes robust partner APIs through its Technology Partner
  program ("Parceiro Tecnológico"), where approved developers receive test
  credentials and Swagger documentation to build and homologate integrations
  reaching 60,000+ merchants. The public API surface is gated behind partner
  registration; no open developer portal or OpenAPI specification is published.
